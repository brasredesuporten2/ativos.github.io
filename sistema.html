<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Controle de Ativos Internos</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* =============================
       LAYOUT GLOBAL
    ============================= */

    body {
      background-color: #f8f9fa;
    }

    .page-wrapper {
      padding-left: 12px;
      padding-right: 12px;
    }

    .content-max {
      max-width: 1600px;
      margin: 0 auto;
    }

    /* =============================
       TABELA - VISUAL COMPACTO
    ============================= */

    .tabela-container {
      max-height: 500px;
      overflow-x: auto;
      overflow-y: auto;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      background: #ffffff;
    }

    /* força barra horizontal sempre visível */
    .tabela-container::-webkit-scrollbar {
      height: 10px;
    }

    .export-bar {
      position: sticky;
      top: 0;
      background: #ffffff;
      padding: 8px;
      z-index: 3;
      border-bottom: 1px solid #dee2e6;
    }

    .table {
      font-size: 13px;
    }

    .table thead th {
      position: sticky;
      top: 48px;
      background: #f1f3f5;
      z-index: 2;
      white-space: nowrap;
      padding: 6px 8px;
    }

    .table td {
      padding: 4px 8px;
      vertical-align: middle;
      white-space: nowrap;
    }

    /* =============================
       RESPONSIVO MOBILE
    ============================= */

    @media (max-width: 768px) {
      .table {
        font-size: 12px;
      }

      .table td,
      .table th {
        padding: 4px 6px;
      }

      /* garante largura mínima da tabela para scroll */
      .table {
        min-width: 900px;
      }
    }
  </style>
</head>

<body>

<nav class="navbar navbar-dark bg-primary px-3 d-flex justify-content-between">
  <span class="navbar-brand">Controle de Ativos Internos</span>

  <div>
    <span class="text-white me-3" id="usuario"></span>
    <button class="btn btn-sm btn-light" onclick="logout()">Sair</button>
  </div>
</nav>

<div class="container-fluid page-wrapper mt-4">
  <div class="content-max">

    <!-- REGISTRO DE ENTREGA -->
    <div class="card mb-4 p-3">
      <h5>Registrar Entrega</h5>

      <input id="funcionario" class="form-control mb-2" placeholder="Funcionário">
      <input id="setor" class="form-control mb-2" placeholder="Setor">

      <div id="listaEquipamentos">
        <div class="row g-2 mb-2 equipamento-item">
          <div class="col-md-5 col-12">
            <input type="text" class="form-control equipamento" placeholder="Equipamento">
          </div>
          <div class="col-md-5 col-12">
            <input type="text" class="form-control serial" placeholder="Nº de Série">
          </div>
          <div class="col-md-2 col-12 d-grid">
            <button type="button" class="btn btn-outline-success" onclick="adicionarEquipamento()">+</button>
          </div>
        </div>
      </div>

      <label class="mt-2">Data da Entrega</label>
      <input type="date" id="dataEntrega" class="form-control mb-3">

      <button class="btn btn-success" onclick="registrarEntrega()">
        Registrar Entrega
      </button>
    </div>

    <!-- HISTÓRICO -->
    <div class="card p-3">
      <h5>Histórico de Ativos</h5>

      <div class="tabela-container">

        <div class="export-bar">
          <button class="btn btn-outline-primary" onclick="exportarExcel()">
            Exportar Excel
          </button>
        </div>

        <table class="table table-striped mb-0">
          <thead>
            <tr>
              <th>Funcionário</th>
              <th>Setor</th>
              <th>Equipamento</th>
              <th>Serial</th>
              <th>Entrega</th>
              <th>Devolução</th>
              <th>Status</th>
              <th>Ação</th>
            </tr>
          </thead>
          <tbody id="tabela"></tbody>
        </table>

      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="export.js"></script>

</body>
</html>
