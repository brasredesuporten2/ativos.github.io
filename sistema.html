<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Controle de Ativos Internos</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { font-size: 0.85rem; }

    .table thead th {
      position: sticky;
      top: 0;
      background: #f8f9fa;
      z-index: 2;
    }

    .table-responsive {
      overflow-x: auto;
    }

    /* ESTILOS DOS FILTROS */
    .filtros-container {
      background-color: #e9ecef;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: flex-end;
    }

    .filtro-grupo {
      display: flex;
      flex-direction: column;
      min-width: 180px;
      flex: 1 1 180px;
    }

    .filtro-grupo label {
      font-size: 0.75rem;
      font-weight: bold;
      color: #495057;
      margin-bottom: 3px;
      text-transform: uppercase;
    }

    .filtro-input, .filtro-select {
      padding: 6px 10px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    .btn-limpar-filtros {
      background-color: #6c757d;
      color: white;
      border: none;
      padding: 6px 15px;
      border-radius: 4px;
      font-size: 0.8rem;
      height: 35px;
    }

    .btn-limpar-filtros:hover {
      background-color: #5a6268;
    }
  </style>
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary px-3 d-flex justify-content-between">
  <span class="navbar-brand">Controle de Ativos - Entregas</span>

  <div>
    <a href="manutencao.html" class="btn btn-sm btn-light me-2">Manutenção</a>
    <span class="text-white me-3" id="usuario"></span>
    <button class="btn btn-sm btn-light" onclick="logout()">Sair</button>
  </div>
</nav>

<div class="container-fluid px-4 mt-3">

<!-- REGISTRO -->
<div class="card p-3 mb-3">
  <h6>Registrar Entrega</h6>

  <div class="row g-2 mb-2">
    <div class="col-md-4">
      <input id="funcionario" class="form-control text-uppercase" placeholder="Funcionário">
    </div>
    <div class="col-md-4">
      <input id="setor" class="form-control text-uppercase" placeholder="Setor">
    </div>
    <div class="col-md-4">
      <input type="date" id="dataEntrega" class="form-control">
    </div>
  </div>

  <!-- LISTA DE EQUIPAMENTOS -->
  <div id="listaEquipamentos">
    <div class="row g-2 mb-2 equipamento-item">
      <div class="col-md-5">
        <input class="form-control text-uppercase equipamento" placeholder="Equipamento">
      </div>
      <div class="col-md-5">
        <input class="form-control text-uppercase serial" placeholder="Serial">
      </div>
      <div class="col-md-2 d-grid">
        <button type="button" class="btn btn-outline-success" onclick="adicionarEquipamento()">+</button>
      </div>
    </div>
  </div>

  <div class="d-grid">
    <button class="btn btn-success" onclick="registrarEntrega()">Registrar Entrega</button>
  </div>
</div>

<!-- HISTÓRICO -->
<div class="card p-3">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h6>Histórico de Ativos</h6>
    <button class="btn btn-outline-success btn-sm" onclick="exportarExcel('tabelaEntregas')">
      Exportar Excel
    </button>
  </div>

  <!-- FILTROS DO MÓDULO ENTREGA -->
  <div class="filtros-container">
    <div class="filtro-grupo">
      <label>👤 FUNCIONÁRIO</label>
      <input type="text" id="filtroFuncionarioEntrega" class="filtro-input" placeholder="Digite o funcionário">
    </div>
    <div class="filtro-grupo">
      <label>🏢 SETOR</label>
      <input type="text" id="filtroSetorEntrega" class="filtro-input" placeholder="Digite o setor">
    </div>
    <div class="filtro-grupo">
      <label>💻 EQUIPAMENTO</label>
      <input type="text" id="filtroEquipamentoEntrega" class="filtro-input" placeholder="Digite o equipamento">
    </div>
    <div class="filtro-grupo">
      <label>📅 PERÍODO - INÍCIO</label>
      <input type="date" id="filtroDataInicioEntrega" class="filtro-input">
    </div>
    <div class="filtro-grupo">
      <label>📅 PERÍODO - FIM</label>
      <input type="date" id="filtroDataFimEntrega" class="filtro-input">
    </div>
    <div class="filtro-grupo">
      <button class="btn-limpar-filtros" onclick="limparFiltrosEntrega()">🗑️ LIMPAR FILTROS</button>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-striped table-sm">
      <thead>
        <tr>
          <th>Funcionário</th>
          <th>Setor</th>
          <th>Equipamento</th>
          <th>Serial</th>
          <th>Entrega</th>
          <th>Devolução</th>
          <th>Status</th>
          <th>Ação</th>
        </tr>
      </thead>
      <tbody id="tabelaEntregas"></tbody>
    </table>
  </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="export.js"></script>
</body>
</html>
