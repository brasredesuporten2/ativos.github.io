<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Controle de Ativos Internos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary px-3 d-flex justify-content-between">
  <span class="navbar-brand">Controle de Ativos Internos</span>

  <div>
    <span class="text-white me-3" id="usuario"></span>
    <button class="btn btn-sm btn-light" onclick="logout()">Sair</button>
  </div>
</nav>


<div class="container mt-4">

  <div class="card mb-4 p-3">
  <h5>Registrar Entrega</h5>

  <input id="funcionario" class="form-control mb-2" placeholder="Funcionário">
  <input id="setor" class="form-control mb-2" placeholder="Setor">
  <input id="equipamento" class="form-control mb-2" placeholder="Equipamento">
  <input id="serial" class="form-control mb-2" placeholder="Serial">

  <label class="mt-2">Data da Entrega</label>
  <input type="date" id="dataEntrega" class="form-control mb-2">

  <button class="btn btn-success" onclick="registrarEntrega()">Registrar Entrega</button>
</div>


<div class="card mb-4 p-3">
  <h5>Backup e Restauração</h5>

  <button class="btn btn-outline-secondary me-2" onclick="backupDados()">Backup (.json)</button>
  <input type="file" id="arquivoBackup" onchange="restaurarBackup()" class="form-control mt-2">
</div>

<div class="card p-3">
  <h5>Histórico de Ativos</h5>

  <button class="btn btn-outline-primary mb-2" onclick="exportarExcel()">Exportar Excel</button>

  <table class="table table-striped">
    <thead>
		<tr>
			<th>Funcionário</th>
			<th>Setor</th>
			<th>Equipamento</th>
			<th>Serial</th>
			<th>Entrega</th>
			<th>Devolução</th>
			<th>Status</th>
			<th>Ação</th>
		</tr>
	</thead>
    <tbody id="tabela"></tbody>
  </table>
</div>


</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="export.js"></script>
</body>
</html>
