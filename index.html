<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login | Controle de Ativos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f2f4f6;
    }

    .login-container {
      max-width: 1000px;
      min-height: 520px;
      border-radius: 16px;
      overflow: hidden;
    }

    .login-left {
      padding: 40px;
    }

    .login-left h2 {
      font-weight: 700;
    }

    .login-right {
      background-color: #0a7c2f;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-right img {
      max-width: 90%;
      height: auto;
    }

    .btn-login {
      background-color: #0a7c2f;
      border: none;
    }

    .btn-login:hover {
      background-color: #086428;
    }

    @media (max-width: 768px) {
      .login-right {
        display: none;
      }
    }
  </style>
</head>

<body class="d-flex align-items-center justify-content-center vh-100">

<div class="card shadow login-container w-100">

  <div class="row g-0 h-100">

    <!-- LADO ESQUERDO -->
    <div class="col-md-6 login-left d-flex flex-column justify-content-center">

      <div class="mb-4 text-center">
        <img src="brasrede_logo.svg" alt="BrasRede" style="max-width: 180px;">
      </div>

      <h2 class="mb-2">Login | Controle de Ativos</h2>
      <p class="text-muted mb-4">Preencha os dados para acessar</p>

      <div class="mb-3">
        <label class="form-label">E-mail ou Usuário</label>
        <input type="text" id="usuario" class="form-control" placeholder="Digite seu e-mail ou usuário">
      </div>

      <div class="mb-3">
        <label class="form-label">Senha</label>
        <input type="password" id="senha" class="form-control" placeholder="Digite sua senha">
      </div>

      <button class="btn btn-login text-white w-100 mt-3" onclick="login()">
        Entrar
      </button>

      <p id="erro" class="text-danger text-center mt-3"></p>

    </div>

    <!-- LADO DIREITO -->
    <div class="col-md-6 login-right">
      <img src="mobile-encryption.svg" alt="Segurança">
    </div>

  </div>
</div>

<script src="auth.js"></script>
</body>
</html>
