<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Controle de Ativos Internos - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card p-4 shadow" style="width: 350px;">
  <h4 class="text-center mb-3">Controle de Ativos Internos</h4>

  <div class="mb-3">
    <label>Usuário</label>
    <input type="text" id="usuario" class="form-control">
  </div>

  <div class="mb-3">
    <label>Senha</label>
    <input type="password" id="senha" class="form-control">
  </div>

  <button class="btn btn-primary w-100" onclick="login()">Entrar</button>
  <p id="erro" class="text-danger mt-2 text-center"></p>
</div>

<script src="auth.js"></script>
</body>
</html>
