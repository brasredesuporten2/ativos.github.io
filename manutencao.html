<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Registro de Manutenção</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { font-size: 0.85rem; }

    .table thead th {
      position: sticky;
      top: 0;
      background: #f8f9fa;
      z-index: 2;
    }

    .descricao {
      white-space: normal;
      word-break: break-word;
      max-width: 260px;
    }

    .table-responsive {
      overflow-x: auto;
    }

    /* ESTILOS DOS FILTROS */
    .filtros-container {
      background-color: #e9ecef;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: flex-end;
    }

    .filtro-grupo {
      display: flex;
      flex-direction: column;
      min-width: 180px;
      flex: 1 1 180px;
    }

    .filtro-grupo label {
      font-size: 0.75rem;
      font-weight: bold;
      color: #495057;
      margin-bottom: 3px;
      text-transform: uppercase;
    }

    .filtro-input, .filtro-select {
      padding: 6px 10px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    .btn-limpar-filtros {
      background-color: #6c757d;
      color: white;
      border: none;
      padding: 6px 15px;
      border-radius: 4px;
      font-size: 0.8rem;
      height: 35px;
    }

    .btn-limpar-filtros:hover {
      background-color: #5a6268;
    }
  </style>
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary px-3 d-flex justify-content-between">
  <span class="navbar-brand">Controle de Ativos - Manutenção</span>

  <div>
    <a href="sistema.html" class="btn btn-sm btn-light me-2">Entregas</a>
    <span class="text-white me-3" id="usuario"></span>
    <button class="btn btn-sm btn-light" onclick="logout()">Sair</button>
  </div>
</nav>

<div class="container-fluid px-4 mt-3">

<!-- REGISTRO -->
<div class="card p-3 mb-3">
  <h6>Registrar Manutenção</h6>

  <div class="row g-2">
    <div class="col-md-4">
      <input class="form-control text-uppercase" id="funcionario" placeholder="Funcionário">
    </div>
    <div class="col-md-4">
      <input class="form-control text-uppercase" id="setor" placeholder="Setor">
    </div>
    <div class="col-md-4">
      <input class="form-control text-uppercase" id="cidade" placeholder="Cidade">
    </div>

    <div class="col-md-6">
      <input class="form-control text-uppercase" id="equipamento" placeholder="Equipamento">
    </div>
    <div class="col-md-6">
      <input class="form-control text-uppercase" id="serial" placeholder="Nº de Série">
    </div>

    <div class="col-md-6">
      <select class="form-control text-uppercase" id="tipo">
        <option value="">Tipo de Manutenção</option>
        <option>PREVENTIVA</option>
        <option>CORRETIVA</option>
        <option>SUBSTITUIÇÃO</option>
      </select>
    </div>

    <div class="col-md-6">
      <input class="form-control" id="custo" placeholder="Custo (opcional)">
    </div>

    <div class="col-12">
      <textarea class="form-control text-uppercase" id="descricao" placeholder="Descrição"></textarea>
    </div>

    <div class="col-md-6">
      <input type="date" class="form-control" id="dataManutencao">
    </div>

    <div class="col-md-6 d-grid">
      <button class="btn btn-success" onclick="registrarManutencao()">Registrar</button>
    </div>
  </div>
</div>

<!-- HISTÓRICO -->
<div class="card p-3">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h6>Histórico de Manutenções</h6>
    <button class="btn btn-outline-success btn-sm" onclick="exportarExcel('tabelaManutencao')">
      Exportar Excel
    </button>
  </div>

  <!-- FILTROS DO MÓDULO MANUTENÇÃO -->
  <div class="filtros-container">
    <div class="filtro-grupo">
      <label>👤 FUNCIONÁRIO</label>
      <input type="text" id="filtroFuncionarioManutencao" class="filtro-input" placeholder="Digite o funcionário">
    </div>
    <div class="filtro-grupo">
      <label>🏢 SETOR</label>
      <input type="text" id="filtroSetorManutencao" class="filtro-input" placeholder="Digite o setor">
    </div>
    <div class="filtro-grupo">
      <label>🌆 CIDADE</label>
      <input type="text" id="filtroCidadeManutencao" class="filtro-input" placeholder="Digite a cidade">
    </div>
    <div class="filtro-grupo">
      <label>💻 EQUIPAMENTO</label>
      <input type="text" id="filtroEquipamentoManutencao" class="filtro-input" placeholder="Digite o equipamento">
    </div>
    <div class="filtro-grupo">
      <label>📅 PERÍODO - INÍCIO</label>
      <input type="date" id="filtroDataInicioManutencao" class="filtro-input">
    </div>
    <div class="filtro-grupo">
      <label>📅 PERÍODO - FIM</label>
      <input type="date" id="filtroDataFimManutencao" class="filtro-input">
    </div>
    <div class="filtro-grupo">
      <button class="btn-limpar-filtros" onclick="limparFiltrosManutencao()">🗑️ LIMPAR FILTROS</button>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-striped table-sm">
      <thead>
        <tr>
          <th>Funcionário</th>
          <th>Setor</th>
          <th>Cidade</th>
          <th>Equipamento</th>
          <th>Serial</th>
          <th>Tipo</th>
          <th>Descrição</th>
          <th>Custo</th>
          <th>Data</th>
          <th>Usuário</th>
        </tr>
      </thead>
      <tbody id="tabelaManutencao"></tbody>
    </table>
  </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="manutencao.js"></script>
<script src="export.js"></script>
</body>
</html>
